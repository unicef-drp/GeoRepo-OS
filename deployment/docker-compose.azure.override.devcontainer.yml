version: '3.9'
services:
  db:
    volumes:
      - ./volumes/database:/var/lib/postgresql/14
      - ./deployment/volumes/backups:/backups
    ports:
      - "5432:5432"

  redis:
    volumes:
      # fix redis permission issue because it's using user redis (999)
      # sudo chown -R 999:999 ./volumes/tmp_data/redis
      - ./volumes/tmp_data/redis:/tmp

  worker:
    image: kartoza/georepo_dev
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile
      target: dev
    env_file: .azure.env
    volumes:
      - ../django_project:/home/web/django_project
      - ./volumes/static:/home/web/static
      - ./volumes/media:/home/web/media
      - ./volumes/tegola_config:/opt/tegola_config
      - ./volumes/tmp_data/worker:/tmp
    links:
      - db
      - azurite

  celery_beat:
    image: kartoza/georepo_dev
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile
      target: dev
    env_file: .azure.env
    volumes:
      - ../django_project:/home/web/django_project
      - ./volumes/static:/home/web/static
      - ./volumes/media:/home/web/media
      - ./volumes/tegola_config:/opt/tegola_config
      - ./volumes/tmp_data/celery_beat:/tmp

  dev:
    image: kartoza/georepo_dev
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile
      target: dev
    env_file: .azure.env
    volumes:
      - ../:/home/web/project
      - ../django_project:/home/web/django_project
      - ./volumes/static:/home/web/static
      - ./volumes/media:/home/web/media
      - ./volumes/tegola_config:/opt/tegola_config
      - ./volumes/tmp_data/django:/tmp
      - ./volumes/tmp_data:/home/web/logs
    links:
      - db
      - worker
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    entrypoint: ["azurite", "--blobHost", "0.0.0.0", "--blobPort", "10000","-l", "data"]
    volumes:
      - ./volumes/azurite:/opt/azurite/data
    ports:
      - 10000:10000

  logrotate:
    volumes:
      - ./volumes/tmp_data:/logs
      - ./volumes/tmp_data/logrotate:/tmp
